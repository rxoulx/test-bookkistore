services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/src:/var/www/html:ro
    depends_on:
      - web
    networks:
      - frontend-net

  web:
    build: ./web
    volumes:
      - ./web/src:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    command: >
      sh -c "chown -R www-data:www-data storage bootstrap/cache
      && php-fpm"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # Giám sát tài nguyên hệ thống (Telemetry Transport trong sơ đồ công nghệ)
  telemetry:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: bookstore-telemetry
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped
    networks:
      - frontend-net

volumes:
  pgdata:
  vendor:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
